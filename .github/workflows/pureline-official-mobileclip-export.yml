name: Pureline - export verified official MobileCLIP2-S2

on:
  push:
    branches:
      - codex/pureline-official-mobileclip2-s2-20261111
    paths:
      - .github/workflows/pureline-official-mobileclip-export.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-official-s2:
    name: Export from pinned Apple checkpoint and verify parity
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      MOBILECLIP_COMMIT: aecfb5453d022e9deff12f81a150ea8f35194baa
      OPEN_CLIP_COMMIT: 54c9754a94baacac5b2d9b1c76318078d48912af
      EXPECTED_CHECKPOINT_SHA256: 37c2d839a856491f2fcc82c40dc28672dbd0907235b4cd4c38dfff6457f0c09f
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned CPU-only conversion toolchain
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.8.0 torchvision==0.23.0
          python -m pip install \
            numpy==2.0.2 Pillow==11.3.0 huggingface_hub==0.34.4 \
            open_clip_torch==3.2.0 timm==1.0.19 \
            onnx==1.19.0 onnxscript==0.5.6 onnxruntime==1.27.0 \
            loguru==0.7.3 opencv-python-headless==4.11.0.86 \
            thop==0.1.1.post2209072238 tabulate==0.9.0
          git clone --quiet https://github.com/apple/ml-mobileclip.git "$RUNNER_TEMP/ml-mobileclip"
          git -C "$RUNNER_TEMP/ml-mobileclip" checkout --quiet --detach "$MOBILECLIP_COMMIT"
          git clone --quiet https://github.com/mlfoundations/open_clip.git "$RUNNER_TEMP/open_clip"
          git -C "$RUNNER_TEMP/open_clip" checkout --quiet --detach "$OPEN_CLIP_COMMIT"
          git -C "$RUNNER_TEMP/open_clip" apply "$RUNNER_TEMP/ml-mobileclip/mobileclip2/open_clip_inference_only.patch"
          cp -R "$RUNNER_TEMP/ml-mobileclip/mobileclip2/." "$RUNNER_TEMP/open_clip/src/open_clip/"
          python -m pip install --no-deps -e "$RUNNER_TEMP/open_clip"
          echo "PYTHONPATH=$RUNNER_TEMP/ml-mobileclip:$RUNNER_TEMP/open_clip/src" >> "$GITHUB_ENV"
      - name: Download the original exact Apple checkpoint, with SHA-256 validation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .model-cache/mobileclip2-s2
          python - <<'PY'
          from huggingface_hub import hf_hub_download
          from pathlib import Path
          import hashlib
          path = Path(hf_hub_download(
              repo_id="apple/MobileCLIP2-S2",
              filename="mobileclip2_s2.pt",
              revision="72424e7025436db18f15c3eff6ee8c7c15ad4481",
              local_dir=".model-cache/mobileclip2-s2",
          ))
          actual = hashlib.sha256(path.read_bytes()).hexdigest()
          expected = "37c2d839a856491f2fcc82c40dc28672dbd0907235b4cd4c38dfff6457f0c09f"
          if actual != expected:
              raise ValueError(f"Pinned checkpoint mismatch: {actual}")
          print(f"Verified official Apple source checkpoint SHA-256: {actual}")
          PY
      - name: Export original S2 encoder and its matching prompt embeddings
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p official-mobileclip2-s2/reports
          python CrossPlatformImageFilter/tools/model_export/export_mobileclip2_onnx.py \
            --checkpoint .model-cache/mobileclip2-s2/mobileclip2_s2.pt \
            --output official-mobileclip2-s2/mobileclip2_s2_image_encoder.onnx \
            --prompts-output official-mobileclip2-s2/mobileclip2_s2_prompt_embeddings.npz \
            --ios-converter tools/MobileCLIPConversion/convert_mobileclip2_s2.py
          python CrossPlatformImageFilter/tools/model_export/verify_mobileclip_parity.py \
            --checkpoint .model-cache/mobileclip2-s2/mobileclip2_s2.pt \
            --onnx official-mobileclip2-s2/mobileclip2_s2_image_encoder.onnx \
            --prompts official-mobileclip2-s2/mobileclip2_s2_prompt_embeddings.npz \
            --ios-converter tools/MobileCLIPConversion/convert_mobileclip2_s2.py \
            --output official-mobileclip2-s2/reports/parity.json
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          root = Path("official-mobileclip2-s2")
          report = json.loads((root/"reports/parity.json").read_text())
          if not report.get("passed") or report.get("sampleCount") != 10:
              raise ValueError("10-sample official PyTorch-vs-ONNX parity check did not pass")
          for suffix in ("mobileclip2_s2_image_encoder.onnx", "mobileclip2_s2_prompt_embeddings.npz"):
              f = root/suffix
              print("OUTPUT", suffix, f.stat().st_size, hashlib.sha256(f.read_bytes()).hexdigest())
          (root/"reports/provenance.json").write_text(json.dumps({
              "source": "apple/MobileCLIP2-S2",
              "source_revision": "72424e7025436db18f15c3eff6ee8c7c15ad4481",
              "checkpoint_sha256": "37c2d839a856491f2fcc82c40dc28672dbd0907235b4cd4c38dfff6457f0c09f",
              "mobileclip_source_commit": "aecfb5453d022e9deff12f81a150ea8f35194baa",
              "open_clip_source_commit": "54c9754a94baacac5b2d9b1c76318078d48912af",
              "all_ten_parity_samples_passed": True,
              "license": "Apple ML Research Model License (research only)",
              "runtime": "ONNXRuntime CPU",
          }, indent=2) + "\n")
          PY
      - name: Upload verified research-only artifacts (short retention)
        uses: actions/upload-artifact@v4
        with:
          name: Pureline-Official-Apple-MobileCLIP2-S2-ONNX
          path: |
            official-mobileclip2-s2/mobileclip2_s2_image_encoder.onnx
            official-mobileclip2-s2/mobileclip2_s2_prompt_embeddings.npz
            official-mobileclip2-s2/reports/parity.json
            official-mobileclip2-s2/reports/provenance.json
          if-no-files-found: error
          retention-days: 3
