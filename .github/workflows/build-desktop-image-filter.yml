name: Build desktop image filter

on:
  workflow_dispatch:
  push:
    branches:
      - feature/cross-platform-image-filter
    paths:
      - "CrossPlatformImageFilter/**"
      - ".github/workflows/build-desktop-image-filter.yml"
      - "tools/MobileCLIPConversion/convert_mobileclip2_s2.py"
      - "tools/MobileCLIPConversion/download_model.sh"
  pull_request:
    paths:
      - "CrossPlatformImageFilter/**"
      - ".github/workflows/build-desktop-image-filter.yml"

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  MOBILECLIP_COMMIT: aecfb5453d022e9deff12f81a150ea8f35194baa
  OPEN_CLIP_COMMIT: 54c9754a94baacac5b2d9b1c76318078d48912af
  YOLOX_COMMIT: 419778480ab6ec0590e5d3831b3afb3b46ab2aa3

jobs:
  source-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Verify source manifest and isolated layout
        shell: bash
        run: |
          set -euo pipefail
          python CrossPlatformImageFilter/tools/generate_source_manifest.py --check
          test -f CrossPlatformImageFilter/pyproject.toml
          test ! -d CrossPlatformImageFilter/CrossPlatformImageFilter
          ! find CrossPlatformImageFilter -type f \( -name '*.onnx' -o -name '*.npz' -o -name '*.pt' \) -print -quit | grep -q .
          ! find CrossPlatformImageFilter -type d \( -name '.venv' -o -name '.wheel-test' \) -print -quit | grep -q .
      - name: Verify desktop parity with the iOS source contract
        shell: bash
        run: |
          set -euo pipefail
          python CrossPlatformImageFilter/tools/schema_parity/check_mobileclip_contract.py \
            --ios-converter tools/MobileCLIPConversion/convert_mobileclip2_s2.py \
            --desktop-config CrossPlatformImageFilter/config/default.toml
          python CrossPlatformImageFilter/tools/schema_parity/check_swift_schema.py \
            --swift AI-Image-Classifier/Models/ImageSafetyModels.swift \
            --fixture CrossPlatformImageFilter/tests/fixtures/required_response_fields.json

  quality:
    needs: source-integrity
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: CrossPlatformImageFilter/pyproject.toml
      - name: Install runtime and quality dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e 'CrossPlatformImageFilter[dev]'
      - name: Compile, lint, type-check, and test
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p CrossPlatformImageFilter/reports
          cd CrossPlatformImageFilter
          python -m compileall -q src tools
          python -m ruff check .
          python -m ruff format --check .
          python -m mypy src
          python -m pytest -q --junitxml="reports/pytest-${{ runner.os }}.xml"
          python -m pip freeze > "reports/dependencies-${{ runner.os }}.txt"
          python - <<'PY' > "reports/runtime-${{ runner.os }}.json"
          import json, onnxruntime, platform, sys
          print(json.dumps({
              "platform": sys.platform,
              "architecture": platform.machine(),
              "python": platform.python_version(),
              "onnxRuntime": onnxruntime.__version__,
              "availableProviders": onnxruntime.get_available_providers(),
          }, indent=2))
          PY
      - name: Build source distribution and wheel, then smoke-test installed wheel
        shell: bash
        run: |
          set -euo pipefail
          cd CrossPlatformImageFilter
          python -m build
          wheel="$(find dist -maxdepth 1 -name '*.whl' -print -quit)"
          python tools/packaging/wheel_smoke.py \
            --wheel "$wheel" \
            --mock-config config/mock.toml \
            --report "reports/wheel-smoke-${{ runner.os }}.json"
      - name: Upload quality reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: quality-${{ runner.os }}
          path: |
            CrossPlatformImageFilter/reports/
            CrossPlatformImageFilter/dist/
          if-no-files-found: warn
          retention-days: 14

  export-models:
    needs: source-integrity
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            tools/MobileCLIPConversion/requirements.txt
            CrossPlatformImageFilter/pyproject.toml
      - name: Install pinned export toolchain
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install \
            torch==2.8.0 torchvision==0.23.0 numpy==2.0.2 Pillow==11.3.0 \
            huggingface_hub==0.34.4 open_clip_torch==3.2.0 timm==1.0.19 \
            onnx==1.19.0 onnxscript==0.5.6 onnxruntime==1.27.0 \
            loguru==0.7.3 opencv-python-headless==4.11.0.86 \
            thop==0.1.1.post2209072238 tabulate==0.9.0
          git clone https://github.com/apple/ml-mobileclip.git "$RUNNER_TEMP/ml-mobileclip"
          git -C "$RUNNER_TEMP/ml-mobileclip" checkout --detach "$MOBILECLIP_COMMIT"
          git clone https://github.com/mlfoundations/open_clip.git "$RUNNER_TEMP/open_clip"
          git -C "$RUNNER_TEMP/open_clip" checkout --detach "$OPEN_CLIP_COMMIT"
          git -C "$RUNNER_TEMP/open_clip" apply "$RUNNER_TEMP/ml-mobileclip/mobileclip2/open_clip_inference_only.patch"
          cp -R "$RUNNER_TEMP/ml-mobileclip/mobileclip2/." "$RUNNER_TEMP/open_clip/src/open_clip/"
          python -m pip install --no-deps -e "$RUNNER_TEMP/open_clip"
          git clone https://github.com/Megvii-BaseDetection/YOLOX.git "$RUNNER_TEMP/YOLOX"
          git -C "$RUNNER_TEMP/YOLOX" checkout --detach "$YOLOX_COMMIT"
          echo "PYTHONPATH=$RUNNER_TEMP/ml-mobileclip:$RUNNER_TEMP/open_clip/src" >> "$GITHUB_ENV"
      - name: Acquire and export pinned runtime models
        shell: bash
        run: |
          set -euo pipefail
          models=CrossPlatformImageFilter/models
          mkdir -p "$models/licenses" CrossPlatformImageFilter/reports/model
          tools/MobileCLIPConversion/download_model.sh .model-cache/mobileclip2-s2
          python CrossPlatformImageFilter/tools/model_export/export_mobileclip2_onnx.py \
            --checkpoint .model-cache/mobileclip2-s2/mobileclip2_s2.pt \
            --output "$models/mobileclip2_s2_image_encoder.onnx" \
            --prompts-output "$models/mobileclip2_s2_prompt_embeddings.npz" \
            --ios-converter tools/MobileCLIPConversion/convert_mobileclip2_s2.py
          python CrossPlatformImageFilter/tools/model_export/verify_mobileclip_parity.py \
            --checkpoint .model-cache/mobileclip2-s2/mobileclip2_s2.pt \
            --onnx "$models/mobileclip2_s2_image_encoder.onnx" \
            --prompts "$models/mobileclip2_s2_prompt_embeddings.npz" \
            --ios-converter tools/MobileCLIPConversion/convert_mobileclip2_s2.py \
            --output CrossPlatformImageFilter/reports/model/mobileclip-parity.json
          python CrossPlatformImageFilter/tools/model_download/acquire_nudenet.py \
            --output "$models/nudenet320n.onnx" --licenses "$models/licenses"
          python CrossPlatformImageFilter/tools/model_download/acquire_yolox.py \
            --output .model-cache/yolox/yolox_nano.pth
          python CrossPlatformImageFilter/tools/model_export/export_yolox_onnx.py \
            --yolox-root "$RUNNER_TEMP/YOLOX" \
            --checkpoint .model-cache/yolox/yolox_nano.pth \
            --input-size 416 \
            --output "$models/person_detector.onnx"
          cp tools/MobileCLIPConversion/MODEL_LICENSE.md "$models/licenses/MobileCLIP2-MODEL-LICENSE.md"
          cp "$RUNNER_TEMP/YOLOX/LICENSE" "$models/licenses/YOLOX-CODE-LICENSE.txt"
          python CrossPlatformImageFilter/tools/model_export/build_runtime_manifest.py \
            --models "$models" \
            --sources "$models/model-sources.json" \
            --output "$models/runtime-manifest.json" \
            > CrossPlatformImageFilter/reports/model/runtime-manifest.log
          cp "$models/runtime-manifest.json" CrossPlatformImageFilter/reports/model/
          cp "$models/model-sources.json" CrossPlatformImageFilter/reports/model/
          cp -R "$models/licenses" CrossPlatformImageFilter/reports/model/
          python CrossPlatformImageFilter/tools/model_export/verify_onnx_models.py \
            "$models/mobileclip2_s2_image_encoder.onnx" \
            "$models/nudenet320n.onnx" \
            "$models/person_detector.onnx" \
            --prompt-embeddings "$models/mobileclip2_s2_prompt_embeddings.npz" \
            > CrossPlatformImageFilter/reports/model/model-verification.json
      - name: Upload runtime models
        uses: actions/upload-artifact@v7
        with:
          name: CrossPlatformImageFilter-models
          path: |
            CrossPlatformImageFilter/models/*.onnx
            CrossPlatformImageFilter/models/*.npz
            CrossPlatformImageFilter/models/runtime-manifest.json
            CrossPlatformImageFilter/models/model-sources.json
            CrossPlatformImageFilter/models/nudenet_labels.json
            CrossPlatformImageFilter/models/coco_labels.json
            CrossPlatformImageFilter/models/licenses/
          if-no-files-found: error
          retention-days: 14
      - name: Upload model reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: model-reports
          path: CrossPlatformImageFilter/reports/model/
          if-no-files-found: warn
          retention-days: 14

  real-model-smoke:
    needs: [quality, export-models]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: CrossPlatformImageFilter/pyproject.toml
      - uses: actions/download-artifact@v8
        with:
          name: CrossPlatformImageFilter-models
          path: CrossPlatformImageFilter/models
      - name: Verify and smoke-test real model sessions
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e 'CrossPlatformImageFilter[dev]'
          mkdir -p CrossPlatformImageFilter/reports/real-model
          local-image-filter models inspect --config CrossPlatformImageFilter/config/default.toml \
            > CrossPlatformImageFilter/reports/real-model/models-inspect.json
          local-image-filter models verify --config CrossPlatformImageFilter/config/default.toml \
            > CrossPlatformImageFilter/reports/real-model/models-verify.json
          local-image-filter doctor --config CrossPlatformImageFilter/config/default.toml --load-models \
            > CrossPlatformImageFilter/reports/real-model/doctor.json
          python CrossPlatformImageFilter/tools/model_export/real_model_smoke.py \
            --config CrossPlatformImageFilter/config/default.toml \
            --output CrossPlatformImageFilter/reports/real-model/benchmark-and-smoke.json
      - name: Upload real-model reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: real-model-reports
          path: CrossPlatformImageFilter/reports/real-model/
          if-no-files-found: warn
          retention-days: 14

  package-platform:
    needs: real-model-smoke
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            artifact: CrossPlatformImageFilter-windows-x64
          - os: macos-latest
            platform: macos
            artifact: CrossPlatformImageFilter-macos
          - os: ubuntu-latest
            platform: linux
            artifact: CrossPlatformImageFilter-linux-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: CrossPlatformImageFilter/pyproject.toml
      - uses: actions/download-artifact@v8
        with:
          name: CrossPlatformImageFilter-models
          path: CrossPlatformImageFilter/models
      - name: Build platform bundle with offline wheels
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install build==1.4.0 Pillow==12.3.0
          cd CrossPlatformImageFilter
          python -m build
          mkdir -p build/offline-wheels build/bundles
          wheel="$(find dist -maxdepth 1 -name '*.whl' -print -quit)"
          python -m pip download --only-binary=:all: --dest build/offline-wheels "$wheel"
          python tools/packaging/create_bundle.py \
            --root . --wheel "$wheel" --models models \
            --offline-wheels build/offline-wheels \
            --platform "${{ matrix.platform }}" \
            --output "build/bundles/${{ matrix.artifact }}.zip"
      - name: Upload platform bundle
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            CrossPlatformImageFilter/build/bundles/${{ matrix.artifact }}.zip
            CrossPlatformImageFilter/build/bundles/${{ matrix.artifact }}.zip.sha256
            CrossPlatformImageFilter/build/bundles/${{ matrix.artifact }}.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload bundle report
        uses: actions/upload-artifact@v7
        with:
          name: bundle-report-${{ matrix.platform }}
          path: |
            CrossPlatformImageFilter/build/bundles/${{ matrix.artifact }}.zip.sha256
            CrossPlatformImageFilter/build/bundles/${{ matrix.artifact }}.json
          if-no-files-found: error
          retention-days: 14

  reports:
    needs: [source-integrity, quality, export-models, real-model-smoke, package-platform]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: quality-*
          path: collected-reports/quality
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: model-reports
          path: collected-reports/models
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: real-model-reports
          path: collected-reports/real-model
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: bundle-report-*
          path: collected-reports/bundles
      - name: Add source manifest and job result summary
        shell: bash
        env:
          SOURCE_RESULT: ${{ needs.source-integrity.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          EXPORT_RESULT: ${{ needs.export-models.result }}
          SMOKE_RESULT: ${{ needs.real-model-smoke.result }}
          PACKAGE_RESULT: ${{ needs.package-platform.result }}
        run: |
          set -euo pipefail
          cp CrossPlatformImageFilter/MANIFEST.sha256 collected-reports/source-manifest.sha256
          python - <<'PY'
          import json, os, pathlib
          result = {name: os.environ[name] for name in (
              "SOURCE_RESULT", "QUALITY_RESULT", "EXPORT_RESULT", "SMOKE_RESULT", "PACKAGE_RESULT"
          )}
          pathlib.Path("collected-reports/job-results.json").write_text(json.dumps(result, indent=2) + "\n")
          PY
      - name: Upload consolidated reports
        uses: actions/upload-artifact@v7
        with:
          name: CrossPlatformImageFilter-reports
          path: collected-reports/
          if-no-files-found: warn
          retention-days: 14
