name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/local-coreml-http-server
      - feature/raw-nudenet-inference-api
      - feature/mobileclip2-person-classifier
      - fix/mobileclip2-ios-device-runtime
      - feature/modular-image-safety-pipeline
  pull_request:
    branches:
      - main
      - feature/mobileclip2-person-classifier
      - fix/mobileclip2-ios-device-runtime
      - feature/modular-image-safety-pipeline

permissions:
  contents: read

jobs:
  build-test-package:
    runs-on: macos-latest
    timeout-minutes: 240
    env:
      APP_MODELS: AI-Image-Classifier/Models
      CHECKPOINT_DIR: .model-cache/mobileclip2-s2
      CONVERTED_DIR: .model-cache/coreml-mobileclip2-s2
      MOBILECLIP_COMMIT: aecfb5453d022e9deff12f81a150ea8f35194baa
      OPEN_CLIP_COMMIT: 54c9754a94baacac5b2d9b1c76318078d48912af

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Set up conversion Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: tools/MobileCLIPConversion/requirements.txt

      - name: Cache official checkpoint and verified Core ML conversion
        uses: actions/cache@v5
        with:
          path: |
            .model-cache/mobileclip2-s2
            .model-cache/coreml-mobileclip2-s2
          key: mobileclip2-s2-fp16-ios17-${{ runner.os }}-${{ hashFiles('tools/MobileCLIPConversion/**') }}

      - name: Install pinned conversion dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r tools/MobileCLIPConversion/requirements.txt

          git clone https://github.com/apple/ml-mobileclip.git "$RUNNER_TEMP/ml-mobileclip"
          git -C "$RUNNER_TEMP/ml-mobileclip" checkout --detach "$MOBILECLIP_COMMIT"
          git clone https://github.com/mlfoundations/open_clip.git "$RUNNER_TEMP/open_clip"
          git -C "$RUNNER_TEMP/open_clip" checkout --detach "$OPEN_CLIP_COMMIT"
          git -C "$RUNNER_TEMP/open_clip" apply "$RUNNER_TEMP/ml-mobileclip/mobileclip2/open_clip_inference_only.patch"
          cp -R "$RUNNER_TEMP/ml-mobileclip/mobileclip2/." "$RUNNER_TEMP/open_clip/src/open_clip/"
          python -m pip install -e "$RUNNER_TEMP/open_clip"
          echo "PYTHONPATH=$RUNNER_TEMP/ml-mobileclip:$RUNNER_TEMP/open_clip/src" >> "$GITHUB_ENV"

      - name: Download and checksum Apple's official MobileCLIP2-S2 checkpoint
        shell: bash
        run: tools/MobileCLIPConversion/download_model.sh "$CHECKPOINT_DIR"

      - name: Convert MobileCLIP2-S2 to Core ML
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/build-diagnostics
          image="$CONVERTED_DIR/MobileCLIP2S2ImageEncoder.mlpackage"
          prompts="$CONVERTED_DIR/MobileCLIP2S2PromptEmbeddings.json"
          manifest="$CONVERTED_DIR/MobileCLIP2S2ModelManifest.json"
          if [[ ! -d "$image" || ! -s "$prompts" || ! -s "$manifest" ]]; then
            rm -rf "$CONVERTED_DIR"
            python tools/MobileCLIPConversion/convert_mobileclip2_s2.py \
              --checkpoint "$CHECKPOINT_DIR/mobileclip2_s2.pt" \
              --output "$CONVERTED_DIR" 2>&1 \
              | tee build/build-diagnostics/conversion.log
          else
            echo "Using cached converted model packages" \
              | tee build/build-diagnostics/conversion.log
          fi

      - name: Inspect primary MIL program
        shell: bash
        run: |
          set -o pipefail
          python tools/MobileCLIPConversion/inspect_mil_program.py \
            "$CONVERTED_DIR/MobileCLIP2S2ImageEncoder.mlpackage" \
            --output build/build-diagnostics 2>&1 \
            | tee build/build-diagnostics/mil-inspection.log

      - name: Verify Core ML against PyTorch
        shell: bash
        run: |
          set -euo pipefail
          python tools/MobileCLIPConversion/verify_conversion.py \
            --checkpoint "$CHECKPOINT_DIR/mobileclip2_s2.pt" \
            --models "$CONVERTED_DIR" \
            --output conversion-verification.json

      - name: Build diagnostic conversion variants
        shell: bash
        run: |
          set +e
          set -uo pipefail
          mkdir -p build/model-variants
          variants=("trace float16 iOS17" "trace float16 iOS18" "trace float32 iOS17")
          for variant in "${variants[@]}"; do
            read -r method precision target <<< "$variant"
            target_identifier="$(printf '%s' "$target" | tr '[:upper:]' '[:lower:]')"
            identifier="$method-$precision-$target_identifier"
            set +e
            python tools/MobileCLIPConversion/convert_mobileclip2_s2.py \
              --checkpoint "$CHECKPOINT_DIR/mobileclip2_s2.pt" \
              --output "build/model-variants/$identifier" \
              --export-method "$method" --precision "$precision" --deployment-target "$target" \
              > "build/model-variants/$identifier.log" 2>&1
            conversion_status=$?
            verification_status=1
            inspection_status=1
            if [[ "$conversion_status" == 0 ]]; then
              python tools/MobileCLIPConversion/verify_conversion.py \
                --checkpoint "$CHECKPOINT_DIR/mobileclip2_s2.pt" \
                --models "build/model-variants/$identifier" \
                --output "build/model-variants/$identifier/verification.json" \
                >> "build/model-variants/$identifier.log" 2>&1
              verification_status=$?
              python tools/MobileCLIPConversion/inspect_mil_program.py \
                "build/model-variants/$identifier/MobileCLIP2S2ImageEncoder.mlpackage" \
                --output "build/model-variants/$identifier" \
                >> "build/model-variants/$identifier.log" 2>&1
              inspection_status=$?
            fi
            python - "$identifier" "$conversion_status" "$verification_status" "$inspection_status" <<'PY'
          import json, pathlib, sys
          identifier, conversion, verification, inspection = sys.argv[1:]
          path = pathlib.Path("build/model-variants") / f"{identifier}-status.json"
          path.write_text(json.dumps({
              "identifier": identifier, "conversionSucceeded": conversion == "0",
              "verificationSucceeded": verification == "0", "inspectionSucceeded": inspection == "0"
          }, indent=2) + "\n")
          PY
          done
          python tools/MobileCLIPConversion/convert_mobileclip2_s2.py \
            --checkpoint "$CHECKPOINT_DIR/mobileclip2_s2.pt" \
            --output build/model-variants/export-float16-ios17 \
            --export-method export --precision float16 --deployment-target iOS17 \
            > build/build-diagnostics/torch-export.log 2>&1
          export_status=$?
          export_verification_status=1
          export_inspection_status=1
          if [[ "$export_status" == 0 ]]; then
            python tools/MobileCLIPConversion/verify_conversion.py \
              --checkpoint "$CHECKPOINT_DIR/mobileclip2_s2.pt" \
              --models build/model-variants/export-float16-ios17 \
              --output build/model-variants/export-float16-ios17/verification.json
            export_verification_status=$?
            python tools/MobileCLIPConversion/inspect_mil_program.py \
              build/model-variants/export-float16-ios17/MobileCLIP2S2ImageEncoder.mlpackage \
              --output build/model-variants/export-float16-ios17
            export_inspection_status=$?
          fi
          python - "$export_status" "$export_verification_status" "$export_inspection_status" <<'PY'
          import json, pathlib, sys
          conversion, verification, inspection = map(int, sys.argv[1:])
          path = pathlib.Path("build/model-variants/export-float16-ios17-status.json")
          path.write_text(json.dumps({
              "identifier":"export-float16-ios17", "conversionSucceeded":conversion == 0,
              "verificationSucceeded":verification == 0, "inspectionSucceeded":inspection == 0,
              "toolchainSupported":conversion == 0
          }, indent=2) + "\n")
          PY

      - name: Validate all build inputs early
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/build-diagnostics "$APP_MODELS"
          rm -rf "$APP_MODELS"/MobileCLIP2S2TextEncoder.mlpackage "$APP_MODELS"/MobileCLIP2S2TextEncoder.mlmodelc
          test -s "$CHECKPOINT_DIR/mobileclip2_s2.pt"
          python tools/model_conversion/validate_committed_model.py
          test -d "$CONVERTED_DIR/MobileCLIP2S2ImageEncoder.mlpackage"
          test -s "$CONVERTED_DIR/MobileCLIP2S2PromptEmbeddings.json"
          test -s "$CONVERTED_DIR/MobileCLIP2S2ModelManifest.json"
          test -s "$CONVERTED_DIR/MobileCLIP2S2ConversionReport.json"
          ! find "$CONVERTED_DIR" -iname '*TextEncoder*' -print -quit | grep -q .
          test -s conversion-verification.json
          test "$(python -c 'import json; print(json.load(open("conversion-verification.json"))["passed"])')" = True
          cp -R "$CONVERTED_DIR/MobileCLIP2S2ImageEncoder.mlpackage" "$APP_MODELS/"
          cp "$CONVERTED_DIR/MobileCLIP2S2PromptEmbeddings.json" "$APP_MODELS/"
          cp "$CONVERTED_DIR/MobileCLIP2S2ModelManifest.json" "$APP_MODELS/"
          cp "$CONVERTED_DIR/MobileCLIP2S2ConversionReport.json" "$APP_MODELS/"
          cp tools/MobileCLIPConversion/MODEL_LICENSE.md "$APP_MODELS/MobileCLIP2S2-MODEL-LICENSE.md"
          xcodebuild -version | tee build/build-diagnostics/xcode-version.txt
          xcodebuild -project AI-Image-Classifier.xcodeproj -list -json \
            | tee build/build-diagnostics/xcodebuild-list.json
          python - <<'PY'
          import json
          data = json.load(open("build/build-diagnostics/xcodebuild-list.json"))
          schemes = data["project"]["schemes"]
          assert "AI-Image-Classifier" in schemes, schemes
          PY

      - name: Resolve Swift packages
        shell: bash
        run: |
          set -o pipefail
          xcodebuild \
            -project AI-Image-Classifier.xcodeproj \
            -scheme AI-Image-Classifier \
            -resolvePackageDependencies 2>&1 \
            | tee build/build-diagnostics/package-resolution.log

      - name: Run unit tests
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -project AI-Image-Classifier.xcodeproj -scheme AI-Image-Classifier \
            -showdestinations 2>&1 | tee build/build-diagnostics/xcodebuild-destinations.log
          device_id="$(
            xcrun simctl list devices available -j | ruby -rjson -e '
              data = JSON.parse(STDIN.read)
              device = data.fetch("devices").values.flatten.find do |candidate|
                candidate["isAvailable"] == true && candidate["name"].to_s.start_with?("iPhone")
              end
              abort "No available iPhone simulator was found" unless device
              puts device.fetch("udid")
            '
          )"
          xcrun simctl boot "$device_id" 2>/dev/null || true
          xcrun simctl bootstatus "$device_id" -b
          set -o pipefail
          xcodebuild \
            -project AI-Image-Classifier.xcodeproj \
            -scheme AI-Image-Classifier \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$device_id" \
            -derivedDataPath "$PWD/build/TestDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            test 2>&1 | tee build/build-diagnostics/xcodebuild-tests.log

      - name: Build for generic iOS device without signing
        shell: bash
        run: |
          set -o pipefail
          xcodebuild \
            -project AI-Image-Classifier.xcodeproj \
            -scheme AI-Image-Classifier \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$PWD/build/DerivedData" \
            -disableAutomaticPackageResolution \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            DEVELOPMENT_TEAM='' \
            INFOPLIST_KEY_GitCommit="$GITHUB_SHA" \
            INFOPLIST_KEY_GitBranch="$GITHUB_REF_NAME" \
            INFOPLIST_KEY_BuildDate="$(date -u +%FT%TZ)" \
            INFOPLIST_KEY_CoreMLToolsVersion=9.0 \
            INFOPLIST_KEY_PyTorchVersion=2.8.0 \
            build 2>&1 | tee build/build-diagnostics/xcodebuild.log

      - name: Archive for generic iOS device without signing
        shell: bash
        run: |
          set -o pipefail
          xcodebuild \
            -project AI-Image-Classifier.xcodeproj \
            -scheme AI-Image-Classifier \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/AI-Image-Classifier.xcarchive" \
            -disableAutomaticPackageResolution \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' DEVELOPMENT_TEAM='' \
            INFOPLIST_KEY_GitCommit="$GITHUB_SHA" INFOPLIST_KEY_GitBranch="$GITHUB_REF_NAME" \
            INFOPLIST_KEY_BuildDate="$(date -u +%FT%TZ)" INFOPLIST_KEY_CoreMLToolsVersion=9.0 INFOPLIST_KEY_PyTorchVersion=2.8.0 \
            archive 2>&1 | tee build/build-diagnostics/xcodebuild-archive.log

      - name: Package and validate unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          app="$PWD/build/AI-Image-Classifier.xcarchive/Products/Applications/AI-Image-Classifier.app"
          test -d "$app/MobileCLIP2S2ImageEncoder.mlmodelc"
          test -n "$(find "$app/MobileCLIP2S2ImageEncoder.mlmodelc" -type f -print -quit)"
          test -s "$app/MobileCLIP2S2PromptEmbeddings.json"
          test -s "$app/MobileCLIP2S2ModelManifest.json"
          test -s "$app/MobileCLIP2S2-MODEL-LICENSE.md"
          test -d "$app/NudeNet320n.mlmodelc"
          test -n "$(find "$app/NudeNet320n.mlmodelc" -type f -print -quit)"
          ! find "$app" -iname '*TextEncoder*' -print -quit | grep -q .
          ! find "$app" -name 'mobileclip2_s2.pt' -print -quit | grep -q .
          if ! plutil -replace UIFileSharingEnabled -bool YES "$app/Info.plist"; then
            plutil -insert UIFileSharingEnabled -bool YES "$app/Info.plist"
          fi
          rm -rf build/ipa
          mkdir -p build/ipa/Payload
          cp -R "$app" build/ipa/Payload/
          (cd build/ipa && zip -r ../AI-Image-Classifier-unsigned.ipa Payload)
          test -s build/AI-Image-Classifier-unsigned.ipa
          unzip -l build/AI-Image-Classifier-unsigned.ipa | tee build/build-diagnostics/ipa-contents.txt
          find build/ipa/Payload -maxdepth 5 -type f | sort | tee build/build-diagnostics/payload-files.txt
          plutil -p "$app/Info.plist" | tee build/build-diagnostics/final-info-plist.txt
          python - "$app/Info.plist" <<'PY'
          import plistlib, sys
          with open(sys.argv[1], "rb") as stream:
              info = plistlib.load(stream)
          assert info.get("UIFileSharingEnabled") is True, info.get("UIFileSharingEnabled")
          assert info.get("LSSupportsOpeningDocumentsInPlace") is True, info.get("LSSupportsOpeningDocumentsInPlace")
          PY

      - name: Record artifact sizes and build summary
        if: always()
        shell: bash
        run: |
          set +e
          image_size=$(du -sk "$CONVERTED_DIR/MobileCLIP2S2ImageEncoder.mlpackage" 2>/dev/null | awk '{print $1 * 1024}')
          prompt_size=$(stat -f '%z' "$CONVERTED_DIR/MobileCLIP2S2PromptEmbeddings.json" 2>/dev/null)
          ipa_size=$(stat -f '%z' build/AI-Image-Classifier-unsigned.ipa 2>/dev/null)
          ipa_sha=$(shasum -a 256 build/AI-Image-Classifier-unsigned.ipa 2>/dev/null | awk '{print $1}')
          app_size=$(du -sk build/AI-Image-Classifier.xcarchive/Products/Applications/AI-Image-Classifier.app 2>/dev/null | awk '{print $1 * 1024}')
          nudenet_size=$(du -sk AI-Image-Classifier/Models/NudeNet320n.mlpackage 2>/dev/null | awk '{print $1 * 1024}')
          nudenet_sha=$(find AI-Image-Classifier/Models/NudeNet320n.mlpackage -type f -print0 | sort -z | xargs -0 shasum -a 256 | shasum -a 256 | awk '{print $1}')
          model_sha=$(python -c 'import json, os; print(json.load(open(os.environ["CONVERTED_DIR"] + "/MobileCLIP2S2ModelManifest.json"))["checkpointSHA256"])' 2>/dev/null)
          verification=$(python -c 'import json; print(json.load(open("conversion-verification.json"))["passed"])' 2>/dev/null)
          {
            echo '## MobileCLIP2-S2 unsigned IPA build'
            echo "- Commit: $GITHUB_SHA"
            echo "- Branch: $GITHUB_REF_NAME"
            echo "- Xcode: $(xcodebuild -version | tr '\n' ' ')"
            echo "- Model source: https://huggingface.co/apple/MobileCLIP2-S2"
            echo "- Model SHA-256: ${model_sha:-unavailable}"
            echo "- Image encoder bytes: ${image_size:-unavailable}"
            echo "- Text encoder bundled: false"
            echo "- Precision: float16"
            echo "- Minimum model deployment target: iOS17"
            echo "- Export method: torch.jit.trace"
            echo "- Previous artifact: 374891484 bytes"
            echo "- Prompt assets bytes: ${prompt_size:-unavailable}"
            echo "- IPA bytes: ${ipa_size:-unavailable}"
            echo "- IPA SHA-256: ${ipa_sha:-unavailable}"
            echo "- App uncompressed bytes: ${app_size:-unavailable}"
            echo "- NudeNet model: NudeNet320n.mlmodelc"
            echo "- NudeNet source package bytes: ${nudenet_size:-unavailable}"
            echo "- NudeNet source package tree SHA-256: ${nudenet_sha:-unavailable}"
            echo "- Unit tests: see xcodebuild-tests.log"
            echo "- Conversion verification: ${verification:-unavailable}"
            if [[ -s conversion-verification.json ]]; then
              echo
              echo '### Primary conversion verification'
              echo '```json'
              cat conversion-verification.json
              echo '```'
            fi
            if [[ -s build/build-diagnostics/conversion.log && ! -s conversion-verification.json ]]; then
              echo
              echo '<details><summary>Conversion failure tail</summary>'
              echo
              echo '```text'
              tail -n 30 build/build-diagnostics/conversion.log
              echo '```'
              echo '</details>'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ -s build/build-diagnostics/conversion.log && ! -s conversion-verification.json ]]; then
            conversion_error=$(tail -n 15 build/build-diagnostics/conversion.log)
            conversion_error=${conversion_error//'%'/'%25'}
            conversion_error=${conversion_error//$'\r'/'%0D'}
            conversion_error=${conversion_error//$'\n'/'%0A'}
            echo "::error title=MobileCLIP2-S2 conversion failed::$conversion_error"
          fi
          if [[ -s build/build-diagnostics/mil-inspection.log && ! -s build/build-diagnostics/MobileCLIP2S2MILInspection.json ]]; then
            mil_error=$(tail -n 20 build/build-diagnostics/mil-inspection.log)
            mil_error=${mil_error//'%'/'%25'}
            mil_error=${mil_error//$'\r'/'%0D'}
            mil_error=${mil_error//$'\n'/'%0A'}
            echo "::error title=MobileCLIP2-S2 MIL inspection failed::$mil_error"
          fi
          if [[ -s conversion-verification.json && "$verification" != True ]]; then
            verification_error=$(tr '\n' ' ' < conversion-verification.json)
            echo "::error title=MobileCLIP2-S2 verification failed::$verification_error"
          fi
          cp "$CONVERTED_DIR/MobileCLIP2S2ModelManifest.json" build/model-manifest.json 2>/dev/null || true
          cp conversion-verification.json build/conversion-verification.json 2>/dev/null || true

      - name: Upload unsigned IPA, model manifest, verification, and diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: AI-Image-Classifier-ImageSafety-unsigned
          path: |
            build/AI-Image-Classifier-unsigned.ipa
            build/build-diagnostics/
            build/model-manifest.json
            build/conversion-verification.json
            build/model-variants/
            tools/MobileCLIPConversion/MODEL_LICENSE.md
          if-no-files-found: warn
          retention-days: 14
