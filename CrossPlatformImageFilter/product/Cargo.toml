[workspace]
resolver = "2"
members = [
  "apps/desktop/src-tauri",
  "crates/audit-log",
  "crates/licensing",
  "crates/policy-client",
  "crates/secure-storage",
  "crates/supervisor-core",
  "crates/supervisor-ipc",
  "crates/supervisor-platform",
  "services/control-plane",
  "services/supervisor",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "MIT"
publish = false

[workspace.dependencies]
argon2 = "=0.5.3"
axum = "=0.8.9"
base64 = "=0.22.1"
ctrlc = "=3.5.2"
ed25519-dalek = "=2.2.0"
interprocess = "=2.4.2"
rand_core = { version = "=0.6.4", features = ["getrandom"] }
rcgen = { version = "=0.14.8", features = ["pem", "ring"] }
secrecy = "=0.10.3"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
serde_json_canonicalizer = "=0.3.2"
sha2 = "=0.10.9"
subtle = "=2.6.1"
thiserror = "=2.0.19"
time = { version = "=0.3.54", features = ["formatting", "parsing", "serde"] }
tokio = { version = "=1.53.1", features = ["macros", "net", "rt-multi-thread"] }
tower = "=0.5.3"
ureq = { version = "=3.3.0", features = ["json"] }
uuid = { version = "=1.24.0", features = ["serde", "v4"] }
widestring = "=1.2.1"
windows-service = "=0.8.1"

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
strip = "symbols"
