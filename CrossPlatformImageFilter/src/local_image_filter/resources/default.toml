[app]
name = "Local AI Image Filter"
instance_id = "desktop-default"

[proxy]
listen_host = "127.0.0.1"
listen_port = 8080
mode = "regular"
max_body_bytes = 25000000
max_parallel_images = 2
request_timeout_seconds = 45
fail_action = "replace"
ignore_hosts = ["localhost", "127.0.0.1", "::1"]
allowed_content_types = [
  "image/jpeg",
  "image/png",
  "image/webp",
  "image/avif",
  "image/gif",
  "image/heic",
  "image/heif",
]

[processing]
minimum_width = 90
minimum_height = 90
minimum_area = 12000
maximum_dimension = 2048
maximum_total_pixels = 12000000
maximum_person_crops = 12
horizontal_crop_padding = 0.15
vertical_crop_padding = 0.20
jpeg_quality = 88
blur_radius = 32.0
placeholder_text = "Image hidden by local filter"
animated_image_mode = "replace"

[runtime]
mock_models = false
intra_op_threads = 0
inter_op_threads = 1
max_concurrent_inference = 1
provider_priority = [
  "CUDAExecutionProvider",
  "DmlExecutionProvider",
  "CoreMLExecutionProvider",
  "CPUExecutionProvider",
]

[models.person]
path = "models/person_detector.onnx"
adapter = "yolox"
input_size = 416
confidence_threshold = 0.30
iou_threshold = 0.50
class_index = 0
class_count = 80
has_objectness = true
output_layout = "decoded-cxcywh-objectness-class-scores"

[models.mobileclip]
path = "models/mobileclip2_s2_image_encoder.onnx"
adapter = "mobileclip2-image"
prompt_embeddings_path = "models/mobileclip2_s2_prompt_embeddings.npz"
input_size = 256
input_name = "image"
output_name = "embedding"
image_scale = 0.00392156862745098
mean = [0.0, 0.0, 0.0]
std = [1.0, 1.0, 1.0]
temperature = 100.0
class_names = ["woman", "man", "uncertain", "notPerson"]

[models.nudenet]
path = "models/nudenet320n.onnx"
adapter = "nudenet-yolov8"
labels_path = "models/nudenet_labels.json"
input_size = 320
confidence_threshold = 0.20
iou_threshold = 0.45
has_objectness = false
output_layout = "channels-first-cxcywh-class-scores"

[models.manifest]
path = "models/runtime-manifest.json"

[policy]
block_action = "blur"
allow_manual_reveal = false
woman_min_score = 0.42
woman_min_margin_over_man = 0.10
face_fallback_woman_min_score = 0.48
whole_image_fallback_woman_min_score = 0.58
uncertain_min_score = 0.90
block_woman_without_margin_if_score_at_least = 0.70

[policy.nudity_thresholds]
FEMALE_GENITALIA_COVERED = 0.80
FACE_FEMALE = 1.01
BUTTOCKS_EXPOSED = 0.35
FEMALE_BREAST_EXPOSED = 0.30
FEMALE_GENITALIA_EXPOSED = 0.30
MALE_BREAST_EXPOSED = 1.01
ANUS_EXPOSED = 0.30
FEET_EXPOSED = 1.01
BELLY_COVERED = 1.01
FEET_COVERED = 1.01
ARMPITS_COVERED = 1.01
ARMPITS_EXPOSED = 1.01
FACE_MALE = 1.01
BELLY_EXPOSED = 0.75
MALE_GENITALIA_EXPOSED = 0.30
ANUS_COVERED = 0.90
FEMALE_BREAST_COVERED = 0.82
BUTTOCKS_COVERED = 0.82

[merge]
iou_threshold = 0.50
assignment_overlap_threshold = 0.50

[cache]
enabled = true
memory_entries = 1500
sqlite_path = "~/.local-ai-image-filter/cache.sqlite3"
ttl_seconds = 604800

[diagnostics]
enabled = true
directory = "~/.local-ai-image-filter/diagnostics"
store_urls = false
store_image_bytes = false
store_crops = false
max_jsonl_bytes = 25000000
